services:
  auth:
    build:
      context: ./auth
    volumes:
      - ./auth/auth.py:/app/auth.py
  traefik:
    image: traefik:v3.6
    ports:
      - "8080:80"       # The HTTP port
      - "8081:8080"     # The Web UI
    volumes:
      - "./traefik:/etc/traefik:ro"
    depends_on:
      - auth