services:
  auth:
    build:
      context: ./auth
    volumes:
      - ./auth/auth.py:/app/auth.py

  traefik:
    image: traefik:v3.6
    ports:
      - "8080:80"
      - "8081:8080"
    volumes:
      - ./traefik/traefik.yaml:/etc/traefik/traefik.yaml:ro
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
    depends_on:
      - auth

version: "3.9"