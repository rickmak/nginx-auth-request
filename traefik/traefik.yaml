http:

  routers:
    auth-router:
      rule: "PathPrefix(`/`)"
      entryPoints:
        - web
      service: auth-service
      middlewares:
        - auth-middleware

  services:
    auth-service:
      loadBalancer:
        servers:
          - url: "http://auth:5000"

  middlewares:
    auth-middleware:
      forwardAuth:
        address: "http://auth:5000/auth"
        trustForwardHeader: true