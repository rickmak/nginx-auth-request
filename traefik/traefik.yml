# install (static) configuration
# https://doc.traefik.io/traefik/reference/install-configuration/boot-environment/
entryPoints:
  web:
    address: ":80"

api:
  dashboard: true
  insecure: true

log:
  level: INFO

providers:
  # routing (dynamic) configuration, instead of using Docker labels, we will use a file provider 
  file: 
    directory: /etc/traefik  # equivalent to K8s' IngressRoute
    watch: true  # enable hot reloading